<style>
  /* An optional example of Rhythm's own style: the app's palette (its --ui-* tokens, written out because a page has
     only the --rhythm-* names), Manrope for names and DM Sans for reading, three levels of text, and a mint focus ring.
     Change any of it; the page is yours. */
  :root {
    color-scheme: dark;
    font:
      14px/1.5 var(--rhythm-font);
    color: #eef4f3;
    background: #101a22;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: clamp(16px, 3vw, 32px);
  }
  main {
    max-width: 1400px;
    margin: auto;
  }
  header,
  nav,
  .toolbar,
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  header {
    justify-content: space-between;
  }
  h1,
  h2,
  h3,
  p {
    margin: 0;
  }
  h1,
  h2,
  summary {
    font-family: var(--rhythm-display);
    letter-spacing: -0.01em;
  }
  h1 {
    font-size: clamp(21px, 3vw, 28px);
    font-weight: 650;
  }
  h2 {
    font-size: 15px;
    font-weight: 650;
    margin: 24px 0 8px;
    font-variant-numeric: tabular-nums;
  }
  button,
  select,
  input {
    font: inherit;
    font-size: 13px;
    color: #eef4f3;
    border: 1px solid #415560;
    border-radius: 8px;
    background: #20303b;
    padding: 7px 12px;
    min-height: 36px;
  }
  select,
  input {
    font-size: 14px;
  }
  button,
  summary,
  select {
    cursor: pointer;
  }
  button:hover {
    border-color: #678490;
  }
  summary:hover {
    color: #fff;
  }
  /* A chosen view is filled and bordered, so it reads without colour; a primary action is the one mint control. */
  button[aria-pressed="true"] {
    background: #244039;
    border-color: #6a9589;
    color: #eef4f3;
  }
  button.primary {
    background: #a4daca;
    border-color: #a4daca;
    color: #0b1015;
    font-weight: 600;
  }
  button:disabled {
    opacity: 0.55;
    cursor: default;
  }
  :focus-visible {
    outline: 2px solid #b5e7da;
    outline-offset: 3px;
  }
  label {
    color: #b8c8cc;
    font-size: 13px;
  }
  nav {
    margin: 12px 0;
  }
  article,
  details,
  .item {
    background: #17252e;
    border: 1px solid #435a64;
    border-radius: 10px;
    padding: 12px 14px;
    margin: 8px 0;
    overflow-wrap: anywhere;
  }
  summary {
    font-size: 14px;
    font-weight: 600;
    color: #eef4f3;
  }
  summary:focus-visible {
    outline-offset: 2px;
    border-radius: 4px;
  }
  .muted,
  .empty {
    color: #b8c8cc;
  }
  .meta {
    color: #9cafb5;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }
  .copy {
    white-space: pre-wrap;
    margin-top: 8px;
    color: #b8c8cc;
  }
  .empty {
    padding: 12px 0;
  }
  /* The lanes share one line for their names and counts, and each lane's cards start at the same height. */
  .lanes {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
    align-items: start;
  }
  .lane {
    min-width: 0;
  }
  .lane h2 {
    margin: 16px 0 4px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgb(89 118 126 / 0.31);
    font-size: 13px;
    color: #b8c8cc;
  }
  .toolbar {
    margin: 12px 0;
  }
  .toolbar input {
    min-width: 0;
    flex: 1;
  }
  .toolbar select {
    max-width: 100%;
  }
  /* Progress spans its card, so milestones' bars line up under one another. */
  progress {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 6px;
    margin-top: 6px;
    border: 0;
    border-radius: 3px;
    background: #20303b;
    accent-color: #a4daca;
  }
  progress::-webkit-progress-bar {
    border-radius: 3px;
    background: #20303b;
  }
  progress::-webkit-progress-value {
    border-radius: 3px;
    background: #a4daca;
  }
  progress::-moz-progress-bar {
    border-radius: 3px;
    background: #a4daca;
  }
  @media (max-width: 780px) {
    .lanes {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (max-width: 510px) {
    .lanes {
      display: block;
    }
    button,
    select,
    input {
      min-height: 44px;
    }
    /* 16px in a field, under which a phone zooms the page when it takes focus. */
    select,
    input {
      font-size: 16px;
    }
  }
</style>
<script>
  function el(tag, text, cls) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  }
  function action(label, fn) {
    const node = el("button", label);
    node.type = "button";
    node.addEventListener("click", fn);
    return node;
  }
  function records(feed) {
    return feed?.status === "ok" ? feed.memories || [] : [];
  }
  function feedNotice(parent, feed) {
    if (!feed || feed.status !== "ok")
      parent.append(el("p", feed?.reason || "Waiting for data…", "empty"));
    else if (feed.truncated)
      parent.append(
        el(
          "p",
          "Showing the " +
            (feed.memories || feed.entries || []).length +
            " records returned by this feed.",
          "meta",
        ),
      );
  }
  function firstLine(m) {
    return (m.preview || "Untitled").split("\n")[0];
  }
  function card(m, related = new Map()) {
    const box = el("details");
    box.append(el("summary", firstLine(m)));
    const w = m.work;
    if (w) {
      const fields = [
        m.project?.name || m.project?.slug,
        w.type,
        w.state,
        w.claim?.label || w.assignee?.name,
      ];
      if (w.blocked) fields.push("Blocked");
      box.append(el("p", fields.filter(Boolean).join(" · "), "meta"));
      if (w.dependencies?.total) {
        const d = w.dependencies,
          total = d.total - d.cancelled,
          progress = el("progress");
        progress.max = Math.max(1, total);
        progress.value = d.done;
        box.append(
          el("p", d.done + " of " + total + " dependencies done", "meta"),
          progress,
        );
      }
      for (const dep of w.blockedBy || [])
        box.append(
          el(
            "p",
            "Waiting for " +
              (related.has(dep.id)
                ? firstLine(related.get(dep.id))
                : dep.type + " (" + dep.state + ")"),
            "meta",
          ),
        );
    }
    if (m.preview?.includes("\n"))
      box.append(
        el(
          "p",
          m.preview.substring(m.preview.indexOf("\n") + 1).trim(),
          "copy",
        ),
      );
    if (m.graphId)
      box.append(action("Open memory", () => rhythm.openStar(m.graphId)));
    return box;
  }
  function choose(nav, options, value, change) {
    nav.replaceChildren();
    for (const [key, label] of options) {
      const b = action(label, () => change(key));
      b.setAttribute("aria-pressed", String(key === value));
      nav.append(b);
    }
  }
</script>
