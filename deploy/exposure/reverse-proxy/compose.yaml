# Reverse-proxy example: Caddy in front of the app and the engine's /mcp, with HTTPS and a login for the app.
# An extra compose file, added after the main one:
#
#   docker compose -f deploy/compose/compose.yaml -f deploy/exposure/reverse-proxy/compose.yaml up -d
#
# Paths below are relative to deploy/compose/ (the first file's folder), as compose resolves every -f file there.
# Steps, what it exposes and how to undo it: deploy/exposure/reverse-proxy/README.md.
#
# Secret: secrets/proxy_users, one "<name> <bcrypt hash>" line per person (caddy hash-password).

services:
  caddy:
    image: ${RHYTHM_CADDY_IMAGE:-caddy:2.10.2-alpine}
    depends_on:
      app:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      RHYTHM_SITE: ${RHYTHM_SITE:-localhost}
    secrets:
      - proxy_users
    volumes:
      - ../exposure/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and Caddy's own state.
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # The proxy is the one thing meant to be reached from other computers: it binds to all addresses unless
      # RHYTHM_PROXY_BIND says otherwise. Port 80 answers certificate challenges and redirects to HTTPS.
      - "${RHYTHM_PROXY_BIND:-0.0.0.0}:${RHYTHM_PROXY_HTTP_PORT:-80}:80"
      - "${RHYTHM_PROXY_BIND:-0.0.0.0}:${RHYTHM_PROXY_HTTPS_PORT:-443}:443"
    networks:
      # internal reaches app:8080 and engine:8080; egress carries the published ports and certificate requests.
      - internal
      - egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  proxy_users:
    file: ./secrets/proxy_users

volumes:
  caddy-data: {}
  caddy-config: {}
