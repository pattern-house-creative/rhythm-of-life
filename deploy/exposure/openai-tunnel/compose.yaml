# OpenAI Secure MCP Tunnel exposure: OpenAI's tunnel client (tunnel-client) dials out to OpenAI and carries ChatGPT's
# MCP calls to the engine's /mcp on the egress network. Nothing is published on the host and nothing listens for
# the internet. The client adds this recipe's own harness token to every call, so ChatGPT holds no token.
#
# Included from deploy/compose/compose.yaml. The service starts only with the profile:
#   COMPOSE_PROFILES=openai-tunnel in .env (./rhythm connect openai-tunnel adds it), or --profile openai-tunnel
# Steps (the tunnel in the OpenAI platform, the connector in ChatGPT), what it exposes and how to undo it:
# deploy/exposure/openai-tunnel/README.md.
#
# Setting: adapters.openai-tunnel.tunnelId in rhythm.yaml (start.sh reads it from the mounted settings file).
# Secrets, read from files, never an environment value or an argument:
#   secrets/adapters/openai-tunnel_key    a restricted runtime API key with Tunnels Read and Use (./rhythm connect)
#   secrets/harness_openai-tunnel_token   the tunnel's own harness token (./rhythm token create openai-tunnel)
# Both belong to uid 65532, the user the client runs as here (./rhythm up gives them that owner).

services:
  openai-tunnel:
    profiles: ["openai-tunnel"]
    # An exact version: OpenAI publishes one tag per release and recommends a version or a digest over latest.
    image: ${RHYTHM_OPENAI_TUNNEL_IMAGE:-ghcr.io/openai/tunnel-client:v0.0.18@sha256:486321616c197fed2d3fbe7d44f22433ce9a1e6c1ee434c0d6652868a5fda5c1}
    # The published image runs as root; 65532 is the non-root user of the client's own runtime image.
    user: "65532:65532"
    entrypoint: ["/bin/sh", "/etc/rhythm/openai-tunnel.sh"]
    configs:
      - source: rhythm
        target: /etc/rhythm/rhythm.yaml
      - source: openai_tunnel_start
        target: /etc/rhythm/openai-tunnel.sh
    secrets:
      - openai-tunnel_key
      - openai-tunnel_token
    networks:
      # This tunnel only needs the engine and outbound internet.
      - egress
    healthcheck:
      # Liveness only. Whether the tunnel is connected is /readyz (README); an OpenAI outage must not fail ./rhythm up.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

configs:
  openai_tunnel_start:
    file: ./start.sh

secrets:
  # Relative to this file: the install's secrets folder.
  openai-tunnel_key:
    file: ../../compose/secrets/adapters/openai-tunnel_key
  openai-tunnel_token:
    file: ../../compose/secrets/harness_openai-tunnel_token
