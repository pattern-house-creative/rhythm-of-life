# Rhythm of Life: the whole stack in one compose project.
#
#   docker compose -f deploy/compose/compose.yaml config     # check
#   docker compose -f deploy/compose/compose.yaml up -d      # run
#
# Needs Docker Compose 2.20 or later (for include). Each component owns its own file:
#   engine.compose.yaml   postgres, engine, adapter workers, the cli    (owned by engine/)
#   app.compose.yaml      the app: built PWA plus its server facade    (owned by app/)
# This file holds only what they share: networks, the app token and the settings file.
#
# Install-specific files live next to this one and are never committed:
#   rhythm.yaml   settings (copy rhythm.example.yaml)        see docs/configuration.md
#   .env          compose-level settings (copy .env.example)
#   secrets/      one file per secret, created by `rhythm init` and `rhythm token create`
#
# Adapters that need their own container use a compose profile named after the adapter:
# their services carry `profiles: ["<adapter>"]`, join `internal`, and join `egress` only if they
# need the internet. Start one with `--profile <adapter>` or COMPOSE_PROFILES in .env, and turn it
# on in rhythm.yaml (adapters.<adapter>.enabled: true). See contracts/README.md section 3.

name: rhythm

include:
  - path: engine.compose.yaml
  - path: app.compose.yaml
  # Exposure recipes that run a container, each off unless its profile is on (deploy/exposure/README.md).
  - path: ../exposure/tailscale/compose.yaml
  - path: ../exposure/cloudflare/compose.yaml
  - path: ../exposure/openai-tunnel/compose.yaml

networks:
  # The database and the processes that connect to it; no internet or host ports.
  database:
    internal: true
  # Private service names for trusted peers, including installed source plugins and the titles model.
  internal:
    internal: true
  # Outbound connections for adapters, plugins and the MCP-only tunnel. The app does not join it.
  egress: {}
  # The app-facing gateways need both app and engine, outbound connectivity and published ports.
  edge: {}

secrets:
  # The one token the app's server sends to the engine (contracts/README.md section 1.2).
  # Both services read it; the engine stores only its hash.
  app_token:
    file: ./secrets/app_token

configs:
  # Settings for every service. Until rhythm.yaml exists, the example runs the app in demo mode.
  rhythm:
    file: ${RHYTHM_CONFIG_FILE:-./rhythm.example.yaml}
