# CI: the checks of CONTRIBUTING.md, on every push to main and every pull request.
# It cannot hold the maintainers' private scrub patterns, so the scrub check runs its public rules here
# (--public-only); a maintainer runs the full check before every push (docs/dev/conventions.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the scrub check reads every commit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scrub check, every tracked file
        run: node scripts/scrub-check.mjs --all --public-only
      - name: Scrub check, every commit
        run: node scripts/scrub-check.mjs --history --public-only
      - name: Import manifest
        run: node scripts/import-manifest.mjs --check
      - name: Licence inventory
        run: node scripts/dependency-inventory.mjs
      - name: Compose files
        run: docker compose -f deploy/compose/compose.yaml config -q
      - name: Script tests
        run: npm test

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests, build and smoke
        run: npm run verify
      - name: Advisories in what runs
        run: npm audit --omit=dev

  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: engine/global.json
      - name: Restore, locked
        run: dotnet restore engine/Engine.slnx --locked-mode
      - name: Build
        run: dotnet build engine/Engine.slnx --no-restore -warnaserror
      - name: Tests without a database
        run: dotnet test engine/Engine.slnx --no-build
      - name: Vulnerable packages
        run: |
          dotnet list engine/Engine.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  engine-database:
    name: Engine, with its database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: engine/global.json
      # A throwaway pgvector container, removed after. No model files are fetched: the tests that need
      # one say they were skipped.
      - run: sh engine/test-db.sh
